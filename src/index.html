<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaleoNews — Paleontology &amp; Anthropology News</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --card: #222632;
      --accent: #c8a96e;
      --accent-dim: #a08550;
      --text: #e4e4e7;
      --text-muted: #9ca3af;
      --border: #2e3344;
      --tag-bg: #2a2d3a;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <div class="logo">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 2C8.27 2 2 8.27 2 16s6.27 14 14 14 14-6.27 14-14S23.73 2 16 2z" fill="#c8a96e" opacity="0.15"/>
            <path d="M10 22c1-4 3-8 6-10s6-1 7 2-1 6-4 8-5 2-7 1" stroke="#c8a96e" stroke-width="2" stroke-linecap="round" fill="none"/>
            <circle cx="20" cy="12" r="1.5" fill="#c8a96e"/>
            <path d="M8 18c2-1 4 0 5 1" stroke="#c8a96e" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          </svg>
          PaleoNews
        </div>
        <div class="subtitle">Paleontology &amp; Anthropology</div>
      </div>
      <div class="controls">
        <input type="text" class="search-box" id="searchInput" placeholder="Search articles…" />
        <div class="source-filters" id="sourceFilters"></div>
        <button class="refresh-btn" id="refreshBtn" title="Refresh feeds">
          <svg class="spin" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M13.65 2.35A7.96 7.96 0 0 0 8 0a8 8 0 1 0 8 8h-2a6 6 0 1 1-1.76-4.24l-2.12 2.12H16V0l-2.35 2.35z"/>
          </svg>
          Refresh
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="status-bar">
      <span id="articleCount"></span>
      <div style="display:flex;align-items:center;gap:0.75rem">
        <select class="sort-select" id="sortSelect">
          <option value="desc">Newest first</option>
          <option value="asc">Oldest first</option>
        </select>
        <span id="lastUpdated"></span>
      </div>
    </div>
    <div class="news-grid" id="newsGrid"></div>
    <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
      <button class="load-more-btn" id="loadMoreBtn">Load More</button>
      <button class="load-all-btn" id="loadAllBtn">Load All</button>
    </div>
  </main>

  <footer>
    PaleoNews — Aggregating paleontology &amp; anthropology news from leading science publications.
  </footer>

  <script src="js/paleo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
