<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrontendFeed — Frontend Development News Aggregator</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --card: #222632;
      --accent: #61dafb;
      --accent-dim: #3a8db5;
      --text: #e4e4e7;
      --text-muted: #9ca3af;
      --border: #2e3344;
      --tag-bg: #2a2d3a;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <div class="logo">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 2C8.27 2 2 8.27 2 16s6.27 14 14 14 14-6.27 14-14S23.73 2 16 2z" fill="#61dafb" opacity="0.15"/>
            <path d="M7 16h18M16 7v18" stroke="#61dafb" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M10 10l12 12M22 10L10 22" stroke="#61dafb" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
            <rect x="12" y="12" width="8" height="8" rx="1.5" stroke="#61dafb" stroke-width="1.5" fill="none"/>
            <circle cx="16" cy="16" r="2" fill="#61dafb"/>
          </svg>
          FrontendFeed
        </div>
        <div class="subtitle">Frontend Development News Aggregator</div>
      </div>
      <div class="controls">
        <input type="text" class="search-box" id="searchInput" placeholder="Search articles…" />
        <div class="source-filters" id="sourceFilters"></div>
        <button class="refresh-btn" id="refreshBtn" title="Refresh feeds">
          <svg class="spin" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M13.65 2.35A7.96 7.96 0 0 0 8 0a8 8 0 1 0 8 8h-2a6 6 0 1 1-1.76-4.24l-2.12 2.12H16V0l-2.35 2.35z"/>
          </svg>
          Refresh
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="status-bar">
      <span id="articleCount"></span>
      <div style="display:flex;align-items:center;gap:0.75rem">
        <select class="sort-select" id="sortSelect">
          <option value="desc">Newest first</option>
          <option value="asc">Oldest first</option>
        </select>
        <span id="lastUpdated"></span>
      </div>
    </div>
    <div class="news-grid" id="newsGrid"></div>
    <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
      <button class="load-more-btn" id="loadMoreBtn">Load More</button>
      <button class="load-all-btn" id="loadAllBtn">Load All</button>
    </div>
  </main>

  <footer>
    FrontendFeed — Aggregating frontend development news from leading tech publications.
  </footer>

  <script src="js/frontend.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
