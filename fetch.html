<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anthropology</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 style="text-align: center">Hello World</h1>
    <div id="data"></div>
    <script>
      async function fetchData() {
        const response = await fetch(
          "https://corsproxy.io/?https://www.sci.news/wp-json/wp/v2/posts?categories=13",
        );
        const data = await response.json();

        const container = document.getElementById("data");
        console.log(data);
        data.forEach((post) => {
          container.innerHTML += `<div class="container"><h2>${post.title.rendered}</h2><p>${post.content.rendered}</p></div>`;
        });
      }
      fetchData();
    </script>
  </body>
</html>
