<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrontendFeed — Frontend Development News Aggregator</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --card: #222632;
      --accent: #61dafb;
      --accent-dim: #3a8db5;
      --text: #e4e4e7;
      --text-muted: #9ca3af;
      --border: #2e3344;
      --tag-bg: #2a2d3a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    .logo svg { width: 32px; height: 32px; }

    .subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .search-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.85rem;
      color: var(--text);
      font-size: 0.875rem;
      width: 220px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box:focus { border-color: var(--accent); }
    .search-box::placeholder { color: var(--text-muted); }

    .source-filters {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: var(--accent-dim); color: var(--text); }
    .filter-btn.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 600;
    }

    .refresh-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .refresh-btn:hover { opacity: 0.85; }
    .refresh-btn.loading { opacity: 0.6; pointer-events: none; }
    .refresh-btn.loading .spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: border-color 0.2s, transform 0.15s;
    }
    .card:hover { border-color: var(--accent-dim); transform: translateY(-2px); }

    .card-source {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
    }

    .source-badge {
      background: var(--tag-bg);
      color: var(--accent);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-date { color: var(--text-muted); }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .card-title a {
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }
    .card-title a:hover { color: var(--accent); }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }

    .card-tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-top: auto;
    }

    .tag {
      background: var(--tag-bg);
      color: var(--text-muted);
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }

    .loading-state, .error-state, .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }

    .loading-state .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    .skeleton {
      background: linear-gradient(90deg, var(--card) 25%, var(--border) 50%, var(--card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .skeleton-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .skeleton-line { height: 14px; }
    .skeleton-line.w60 { width: 60%; }
    .skeleton-line.w80 { width: 80%; }
    .skeleton-line.w100 { width: 100%; }
    .skeleton-line.h20 { height: 20px; }
    .skeleton-img { height: 160px; width: 100%; }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
      margin-top: 3rem;
    }

    .load-more-wrap {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }

    .load-more-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.75rem 2.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .load-more-btn:hover, .load-all-btn:hover {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    .load-all-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.75rem 2.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .sort-select {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.7rem;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .sort-select:focus { border-color: var(--accent); }

    @media (max-width: 600px) {
      .news-grid { grid-template-columns: 1fr; }
      .header-inner { flex-direction: column; align-items: flex-start; }
      .search-box { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <div class="logo">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 2C8.27 2 2 8.27 2 16s6.27 14 14 14 14-6.27 14-14S23.73 2 16 2z" fill="#61dafb" opacity="0.15"/>
            <path d="M7 16h18M16 7v18" stroke="#61dafb" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M10 10l12 12M22 10L10 22" stroke="#61dafb" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
            <rect x="12" y="12" width="8" height="8" rx="1.5" stroke="#61dafb" stroke-width="1.5" fill="none"/>
            <circle cx="16" cy="16" r="2" fill="#61dafb"/>
          </svg>
          FrontendFeed
        </div>
        <div class="subtitle">Frontend Development News Aggregator</div>
      </div>
      <div class="controls">
        <input type="text" class="search-box" id="searchInput" placeholder="Search articles…" />
        <div class="source-filters" id="sourceFilters"></div>
        <button class="refresh-btn" id="refreshBtn" title="Refresh feeds">
          <svg class="spin" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M13.65 2.35A7.96 7.96 0 0 0 8 0a8 8 0 1 0 8 8h-2a6 6 0 1 1-1.76-4.24l-2.12 2.12H16V0l-2.35 2.35z"/>
          </svg>
          Refresh
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="status-bar">
      <span id="articleCount"></span>
      <div style="display:flex;align-items:center;gap:0.75rem">
        <select class="sort-select" id="sortSelect">
          <option value="desc">Newest first</option>
          <option value="asc">Oldest first</option>
        </select>
        <span id="lastUpdated"></span>
      </div>
    </div>
    <div class="news-grid" id="newsGrid"></div>
    <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
      <button class="load-more-btn" id="loadMoreBtn">Load More</button>
      <button class="load-all-btn" id="loadAllBtn">Load All</button>
    </div>
  </main>

  <footer>
    FrontendFeed — Aggregating frontend development news from leading tech publications.
  </footer>

  <script>
    const FEEDS = [
      {
        name: 'CSS-Tricks',
        rss: 'https://css-tricks.com/feed/',
        color: '#f7c948'
      },
      {
        name: 'Smashing Magazine',
        rss: 'https://www.smashingmagazine.com/feed/',
        color: '#e74c3c'
      },
      {
        name: 'Dev.to',
        rss: 'https://dev.to/feed',
        color: '#3b49df'
      },
      {
        name: 'Hacker News',
        rss: 'https://hnrss.org/frontpage',
        color: '#ff6600'
      },
      {
        name: 'JavaScript Weekly',
        rss: 'https://cprss.s3.amazonaws.com/javascriptweekly.com.xml',
        color: '#f0db4f'
      },
      {
        name: 'React Blog',
        rss: 'https://react.dev/rss.xml',
        color: '#61dafb'
      },
      {
        name: 'Node Weekly',
        rss: 'https://cprss.s3.amazonaws.com/nodeweekly.com.xml',
        color: '#68a063'
      },
      {
        name: 'Frontend Focus',
        rss: 'https://cprss.s3.amazonaws.com/frontendfoc.us.xml',
        color: '#e535ab'
      },
      {
        name: 'web.dev',
        rss: 'https://web.dev/feed.xml',
        color: '#1a73e8'
      }
    ];

    const CORS_PROXIES = [
      url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
      url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
    ];

    const FRONTEND_KEYWORDS = [
      'react', 'vue', 'angular', 'svelte', 'next.js', 'nextjs', 'nuxt',
      'astro', 'remix', 'gatsby', 'vite', 'webpack', 'rollup', 'esbuild',
      'javascript', 'typescript', 'ecmascript', 'node.js', 'nodejs', 'deno', 'bun',
      'css', 'tailwind', 'sass', 'scss', 'html', 'dom', 'browser',
      'frontend', 'front-end', 'web dev', 'web app', 'web component',
      'pwa', 'service worker', 'web worker', 'webassembly', 'wasm',
      'npm', 'yarn', 'pnpm', 'package manager',
      'api', 'rest', 'graphql', 'fetch', 'axios',
      'testing', 'jest', 'vitest', 'cypress', 'playwright',
      'accessibility', 'a11y', 'aria', 'wcag',
      'performance', 'core web vitals', 'lighthouse',
      'security', 'xss', 'csrf', 'csp', 'cors', 'oauth', 'vulnerability',
      'responsive', 'mobile', 'progressive',
      'component', 'hook', 'state management', 'redux', 'zustand', 'pinia',
      'ssr', 'server-side rendering', 'static site', 'jamstack',
      'shadcn', 'radix', 'headless ui', 'ui library',
      'htmx', 'alpine', 'solid', 'qwik', 'preact', 'lit',
      'turbopack', 'rspack', 'swc', 'babel'
    ];

    let allArticles = [];
    let activeSource = 'All';
    let sortOrder = 'desc';
    const PAGE_SIZE = 9;
    let visibleCount = PAGE_SIZE;

    function isFrontendRelated(text) {
      const lower = text.toLowerCase();
      return FRONTEND_KEYWORDS.some(kw => lower.includes(kw));
    }

    function sanitize(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function sanitizeUrl(url) {
      try {
        const parsed = new URL(url);
        if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return sanitize(url);
      } catch {}
      return '';
    }

    function stripHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || '';
    }

    function relativeTime(dateStr) {
      const date = new Date(dateStr);
      if (isNaN(date)) return '';
      const diff = Date.now() - date.getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      const days = Math.floor(hrs / 24);
      if (days < 30) return `${days}d ago`;
      return date.toLocaleDateString();
    }

    async function fetchWithProxy(url) {
      for (const makeProxy of CORS_PROXIES) {
        try {
          const res = await fetch(makeProxy(url), { signal: AbortSignal.timeout(12000) });
          if (res.ok) return await res.text();
        } catch { /* try next proxy */ }
      }
      throw new Error(`All proxies failed for ${url}`);
    }

    function parseRSS(xmlText, sourceName) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlText, 'text/xml');
      const items = [...doc.querySelectorAll('item'), ...doc.querySelectorAll('entry')];
      return items.map(item => {
        const title = item.querySelector('title')?.textContent?.trim() || '';
        const link = item.querySelector('link')?.textContent?.trim()
          || item.querySelector('link')?.getAttribute('href') || '';
        const desc = stripHtml(
          item.querySelector('description')?.textContent
          || item.querySelector('summary')?.textContent
          || item.querySelector('content')?.textContent
          || ''
        ).trim();
        const pubDate = item.querySelector('pubDate')?.textContent
          || item.querySelector('published')?.textContent
          || item.querySelector('updated')?.textContent
          || '';
        const enclosure = item.querySelector('enclosure')?.getAttribute('url') || '';
        const mediaThumbnail = item.getElementsByTagNameNS('http://search.yahoo.com/mrss/', 'thumbnail')[0]?.getAttribute('url') || '';
        const mediaContent = item.getElementsByTagNameNS('http://search.yahoo.com/mrss/', 'content')[0]?.getAttribute('url') || '';
        // Fallback: extract first <img> from HTML description/content
        let imgFromHtml = '';
        if (!enclosure && !mediaThumbnail && !mediaContent) {
          const rawHtml = item.querySelector('description')?.textContent
            || item.querySelector('content')?.textContent
            || item.querySelector('summary')?.textContent || '';
          const imgMatch = rawHtml.match(/<img[^>]+src=["']([^"']+)["']/i);
          if (imgMatch) imgFromHtml = imgMatch[1];
        }
        const image = enclosure || mediaThumbnail || mediaContent || imgFromHtml;

        return { title, link, desc, pubDate, image, source: sourceName };
      });
    }

    async function fetchFeed(feed) {
      try {
        const xml = await fetchWithProxy(feed.rss);
        let articles = parseRSS(xml, feed.name);
        // Filter general feeds for frontend-related content
        if (feed.filterRequired) {
          articles = articles.filter(a => isFrontendRelated(a.title + ' ' + a.desc));
        }
        return articles;
      } catch (e) {
        console.warn(`Failed to fetch ${feed.name}:`, e.message);
        return [];
      }
    }

    function renderSkeletons() {
      const grid = document.getElementById('newsGrid');
      grid.innerHTML = Array(6).fill('').map(() => `
        <div class="skeleton-card">
          <div class="skeleton skeleton-line w60" style="height:12px"></div>
          <div class="skeleton skeleton-line w100 h20"></div>
          <div class="skeleton skeleton-img"></div>
          <div class="skeleton skeleton-line w80"></div>
          <div class="skeleton skeleton-line w60"></div>
        </div>
      `).join('');
    }

    let filteredArticles = [];

    function renderArticles(articles) {
      filteredArticles = articles;
      const grid = document.getElementById('newsGrid');
      const wrap = document.getElementById('loadMoreWrap');
      if (articles.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <p style="font-size:2rem;margin-bottom:0.5rem">&lt;/&gt;</p>
            <p>No frontend development articles found matching your criteria.</p>
            <p style="margin-top:0.5rem;font-size:0.8rem">Try adjusting your search or filters.</p>
          </div>`;
        document.getElementById('articleCount').textContent = '0 articles';
        wrap.style.display = 'none';
        return;
      }

      const shown = articles.slice(0, visibleCount);
      document.getElementById('articleCount').textContent = `${articles.length} article${articles.length !== 1 ? 's' : ''}`;
      grid.innerHTML = shown.map(a => {
        const safeLink = sanitizeUrl(a.link);
        const safeImage = a.image ? sanitizeUrl(a.image) : '';
        return `
        <article class="card">
          <div class="card-source">
            <span class="source-badge">${sanitize(a.source)}</span>
            <span class="card-date">${relativeTime(a.pubDate)}</span>
          </div>
          ${safeImage ? `<img class="card-image" src="${safeImage}" alt="" loading="lazy" onerror="this.remove()"/>` : ''}
          <h2 class="card-title">
            ${safeLink ? `<a href="${safeLink}" target="_blank" rel="noopener noreferrer">${sanitize(a.title)}</a>` : sanitize(a.title)}
          </h2>
          <p class="card-desc">${sanitize(a.desc)}</p>
        </article>`;
      }).join('');

      wrap.style.display = visibleCount < articles.length ? 'flex' : 'none';
    }

    function buildSourceFilters() {
      const container = document.getElementById('sourceFilters');
      const sources = ['All', ...FEEDS.map(f => f.name)];
      container.innerHTML = sources.map(s =>
        `<button class="filter-btn ${s === activeSource ? 'active' : ''}" data-source="${s}">${s}</button>`
      ).join('');
      container.addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        activeSource = btn.dataset.source;
        container.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.source === activeSource));
        applyFilters();
      });
    }

    function applyFilters() {
      visibleCount = PAGE_SIZE;
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      let filtered = allArticles;
      if (activeSource !== 'All') {
        filtered = filtered.filter(a => a.source === activeSource);
      }
      if (query) {
        filtered = filtered.filter(a =>
          a.title.toLowerCase().includes(query) || a.desc.toLowerCase().includes(query)
        );
      }
      filtered = [...filtered].sort((a, b) => {
        const da = new Date(a.pubDate), db = new Date(b.pubDate);
        return sortOrder === 'desc' ? db - da : da - db;
      });
      renderArticles(filtered);
    }

    async function loadAll() {
      const btn = document.getElementById('refreshBtn');
      btn.classList.add('loading');
      renderSkeletons();
      document.getElementById('articleCount').textContent = 'Loading…';
      document.getElementById('lastUpdated').textContent = '';

      const results = await Promise.allSettled(FEEDS.map(f => fetchFeed(f)));
      allArticles = results
        .filter(r => r.status === 'fulfilled')
        .flatMap(r => r.value);

      // Deduplicate by title similarity
      const seen = new Set();
      allArticles = allArticles.filter(a => {
        const key = a.title.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 60);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });

      // Sort by date, newest first
      allArticles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

      btn.classList.remove('loading');
      document.getElementById('lastUpdated').textContent = `Updated ${new Date().toLocaleTimeString()}`;
      applyFilters();
    }

    // Wire up events
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('refreshBtn').addEventListener('click', loadAll);
    document.getElementById('loadMoreBtn').addEventListener('click', () => {
      visibleCount += PAGE_SIZE;
      renderArticles(filteredArticles);
    });
    document.getElementById('loadAllBtn').addEventListener('click', () => {
      visibleCount = filteredArticles.length;
      renderArticles(filteredArticles);
    });
    document.getElementById('sortSelect').addEventListener('change', e => {
      sortOrder = e.target.value;
      applyFilters();
    });
    buildSourceFilters();
    loadAll();
  </script>
</body>
</html>
